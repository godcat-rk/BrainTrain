<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>BrainTrain</title>
    <script>
      // GitHub Pages SPA routing: encode path as query string and redirect to index.html
      var l = window.location
      l.replace(
        l.protocol + '//' + l.host + l.pathname.split('/').slice(0, 1 + 1).join('/') +
        '/?/' + l.pathname.slice(1).split('/').slice(1).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
